<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10141b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Nico & Mika · V7</title><style>*{box-sizing:border-box}body{margin:0;background:#10141b;color:#edf2f7;font:16px system-ui}main{max-width:650px;margin:auto;padding:18px}h1{margin:0}small{color:#aab7c8}section,article{background:#202936;border-radius:14px;padding:14px;margin:12px 0}button,input,select{font:inherit;border:0;border-radius:9px;padding:12px;background:#344155;color:white;min-width:0}button{cursor:pointer;margin:3px 0}button.primary{background:#b7f34b;color:#152000;font-weight:bold}input,select{width:100%;margin:5px 0}label{display:block;font-size:13px;color:#bfcddd}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}.items{max-height:330px;overflow:auto}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #3a4658}.item button{flex-shrink:0}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{flex:1}.muted{color:#bfcddd;font-size:14px}#notice{color:#b7f34b;min-height:22px}h2{font-size:20px}h3{margin:0 0 8px}button:disabled{opacity:.4} .main-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.main-nav button{width:100%;min-width:0;margin:0;padding:12px 6px;font-size:15px;white-space:normal;overflow-wrap:anywhere;line-height:1.3;min-height:46px}.main-nav button:last-child{grid-column:1/-1}@media(min-width:560px){.main-nav{grid-template-columns:repeat(5,minmax(0,1fr))}.main-nav button:last-child{grid-column:auto}}@media(max-width:360px){main{padding:12px}} .nm-demo{margin:8px 0;min-width:0}.nm-demo summary{cursor:pointer;color:#b7f34b;font-size:14px}.nm-motion{display:block;max-width:100%;width:auto;max-height:240px;margin:10px auto;background:#fff;border-radius:8px}.nm-credit{font-size:11px;overflow-wrap:anywhere;color:#bfcddd}.nm-credit a{color:#bfcddd}.nm-training-demo{margin:8px 0}.items .item>div:first-child{min-width:0;flex:1}</style></head><body><main><h1>NICO <span style="color:#b7f34b">&</span> MIKA</h1><small>V7.3 · Version locale · non synchronisée</small><p id="network"></p><nav><button id="install">Installer</button><button id="share">Partager</button></nav><label>Profil<select id="profile"><option>Nico</option><option>Mika</option></select></label><nav class="main-nav"><button id="create">Séances</button><button id="library">Exercices</button><button id="history">Historique</button><button id="calibration">Calibration</button><button id="settings">Profil</button></nav><p id="notice" role="status"></p><div id="app"></div></main><script src="catalog.js"></script><script src="app.js"></script><script src="defaults.js"></script><script src="training.js"></script><script>(() => {
'use strict';
const media = {"ex1": {"file": "Barbell bench press exercise demonstration.webm", "url": "https://upload.wikimedia.org/wikipedia/commons/7/77/Barbell_bench_press_exercise_demonstration.webm", "page": "https://commons.wikimedia.org/wiki/File:Barbell_bench_press_exercise_demonstration.webm", "author": "Your Move", "license": "CC BY-SA 4.0", "video": true}, "ex160": {"file": "Barbell back squat exercise demonstration.webm", "url": "https://upload.wikimedia.org/wikipedia/commons/b/b6/Barbell_back_squat_exercise_demonstration.webm", "page": "https://commons.wikimedia.org/wiki/File:Barbell_back_squat_exercise_demonstration.webm", "author": "Your Move", "license": "CC BY-SA 4.0", "video": true}, "ex28": {"file": "Man Doing Push Ups GIF Animation Loop.gif", "url": "https://upload.wikimedia.org/wikipedia/commons/1/13/Man_Doing_Push_Ups_GIF_Animation_Loop.gif", "page": "https://commons.wikimedia.org/wiki/File:Man_Doing_Push_Ups_GIF_Animation_Loop.gif", "author": "Videoplasty.com", "license": "CC BY-SA 4.0", "video": false}, "ex65": {"file": "Pullup.gif", "url": "https://upload.wikimedia.org/wikipedia/commons/4/40/Pullup.gif", "page": "https://commons.wikimedia.org/wiki/File:Pullup.gif", "author": "Extremistpullup", "license": "Domaine public", "video": false}, "ex73": {"file": "Muscle-up.gif", "url": "https://upload.wikimedia.org/wikipedia/commons/5/58/Muscle-up.gif", "page": "https://commons.wikimedia.org/wiki/File:Muscle-up.gif", "author": "Extremistpullup", "license": "Domaine public", "video": false}, "ex117": {"file": "PreacherBenchBicepsCurl.gif", "url": "https://upload.wikimedia.org/wikipedia/commons/0/08/PreacherBenchBicepsCurl.gif", "page": "https://commons.wikimedia.org/wiki/File:PreacherBenchBicepsCurl.gif", "author": "Mohamed Ouda", "license": "CC BY-SA 3.0", "video": false}, "ex187": {"file": "Squats 01.gif", "url": "https://upload.wikimedia.org/wikipedia/commons/5/52/Squats_01.gif", "page": "https://commons.wikimedia.org/wiki/File:Squats_01.gif", "author": "Zimmermanns", "license": "CC BY 3.0", "video": false}};
const root = document.getElementById('app');
const lookup = (name, subtitle) => CATALOG.find(e => e.name === name && e.muscle+' · '+e.equipment === subtitle);
function panel(id) {
 const m=media[id]; const box=document.createElement('details'); box.className='nm-demo';
 const summary=document.createElement('summary'); summary.textContent=m?'Voir le mouvement':'Visuel non disponible'; box.append(summary);
 if(!m){summary.textContent='Visuel non disponible';return null;}
 const caption=document.createElement('p'); caption.className='nm-credit';
 const source=document.createElement('a'); source.href=m.page; source.target='_blank'; source.rel='noopener noreferrer'; source.textContent=m.file+' — '+m.author+' · Wikimedia Commons'; caption.append(source, document.createTextNode(' · '));
 if(m.license.startsWith('CC')){const l=document.createElement('a');l.href='https://creativecommons.org/licenses/'+(m.license.includes('SA')?'by-sa':'by')+'/'+m.license.split(' ').at(-1)+'/';l.target='_blank';l.rel='noopener noreferrer';l.textContent=m.license;caption.append(l);}else caption.append(document.createTextNode(m.license));
 let player;
 function load(){if(player)return;player=document.createElement(m.video?'video':'img');player.className='nm-motion';if(m.video){player.loop=true;player.muted=true;player.playsInline=true;player.controls=true;player.autoplay=true;}else player.alt='Démonstration de '+(CATALOG.find(e=>e.id===id)?.name||'l’exercice');player.addEventListener('error',()=>{const error=document.createElement('p');error.textContent='Animation indisponible. Vérifie ta connexion ou ouvre la source.';player.replaceWith(error);},{once:true});player.src=m.url;box.insertBefore(player,caption);}
 box.append(caption);box.addEventListener('toggle',()=>{if(box.open){load();if(m.video&&player?.isConnected)player.play().catch(()=>{});}else if(m.video)player?.pause();});return box;
}
function decorate(){
 for(const row of root.querySelectorAll('.items .item')){if(row.dataset.nmDemo)continue;row.dataset.nmDemo='1';const t=row.firstElementChild;const name=t?.querySelector('strong')?.textContent;const sub=t?.querySelector('.muted')?.textContent;const e=lookup(name,sub);if(e&&media[e.id])t.append(panel(e.id));}
 if(typeof tab==='undefined'||tab!=='training')return;
 const w=workout();const x=w?.items?.[exerciseIndex];const section=root.querySelector('section');if(!x||!section||section.querySelector('.nm-training-demo'))return;
 const wrapper=document.createElement('div');wrapper.className='nm-training-demo';const p=panel(x.ex);if(p){wrapper.append(p);p.open=true;}else{wrapper.textContent='Animation non disponible pour cet exercice.';wrapper.classList.add('muted');}
 const fields=section.querySelector('.row');if(fields)section.insertBefore(wrapper,fields);else section.append(wrapper);
}
new MutationObserver(decorate).observe(root,{childList:true,subtree:true});decorate();
})();</script></body></html>
